# Replace the hostname below with the hostname used by your deployment.
map $scheme $pulse_hsts_header {
    https "max-age=63072000; preload";
}

server {
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 3210;

    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name pulse.example.com;

    include conf.d/include/geo-enforce.conf;
    include conf.d/include/access-json.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/delishad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delishad.com/privkey.pem;
    include conf.d/include/force-ssl.conf;

    access_log /var/log/nginx/pulse_access.log proxy;
    error_log /var/log/nginx/pulse_error.log warn;

    location / {
        include conf.d/include/block-exploits.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        include conf.d/include/proxy.conf;
    }

    location = /_geo {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"remote_addr":"$remote_addr","country":"$geoip2_country_code","trusted_ip":"$is_trusted_ip","geo_allow":"$geo_allow"}';
    }
}
