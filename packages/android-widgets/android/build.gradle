buildscript {
  repositories { google(); mavenCentral() }
  dependencies { classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}") }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.pulsewidgets'
version = '0.1.0'

android {
  namespace "expo.modules.pulsewidgets"
  defaultConfig { versionCode 1; versionName '0.1.0' }
  buildFeatures { compose true }
}

dependencies {
  implementation "androidx.glance:glance:1.2.0-rc01"
  implementation "androidx.glance:glance-appwidget:1.2.0-rc01"
}
