name: pulse

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${PULSE_DB_PASSWORD}
    volumes:
      - pulse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  api:
    build:
      context: .
      target: api
    # Set this to a fully-qualified Docker Hub image in production. The local
    # fallback keeps `docker compose build` useful for development and recovery.
    image: ${PULSE_API_IMAGE:-pulse-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pulse:${PULSE_DB_PASSWORD}@db:5432/pulse
      PORT: 4000
      PULSE_WEB_TOKEN: ${PULSE_WEB_TOKEN}
      PULSE_SERVICE_TOKEN: ${PULSE_SERVICE_TOKEN}
      PULSE_DEFAULT_USERNAME: ${PULSE_DEFAULT_USERNAME:-pulse}
      PULSE_LEGACY_DEFAULT_USER_EMAIL: ${PULSE_LEGACY_DEFAULT_USER_EMAIL:-}
      PULSE_DEFAULT_USER_NAME: ${PULSE_DEFAULT_USER_NAME:-Pulse User}
      PULSE_DEFAULT_TIMEZONE: ${PULSE_DEFAULT_TIMEZONE:-Asia/Singapore}
      HERMES_REMINDER_WEBHOOK_URL: ${HERMES_REMINDER_WEBHOOK_URL:-}
      HERMES_REMINDER_WEBHOOK_SECRET: ${HERMES_REMINDER_WEBHOOK_SECRET:-}
      TELEGRAM_FALLBACK_BOT_TOKEN: ${TELEGRAM_FALLBACK_BOT_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  web:
    build:
      context: .
      target: web
    # Set this to a fully-qualified Docker Hub image in production. The local
    # fallback keeps `docker compose build` useful for development and recovery.
    image: ${PULSE_WEB_IMAGE:-pulse-web:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pulse:${PULSE_DB_PASSWORD}@db:5432/pulse
      PULSE_API_INTERNAL_URL: http://api:4000
      PULSE_WEB_TOKEN: ${PULSE_WEB_TOKEN}
      AUTH_SECRET: ${AUTH_SECRET}
      # Set AUTH_URL in the deployment environment to the public Pulse URL.
      AUTH_URL: ${AUTH_URL:-https://pulse.example.com}
      PULSE_REGISTRATION_ENABLED: ${PULSE_REGISTRATION_ENABLED:-false}
      PULSE_AUTH_DISABLED: ${PULSE_AUTH_DISABLED:-false}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${PULSE_WEB_PORT:-3210}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  mcp:
    build:
      context: .
      target: mcp
    image: ${PULSE_MCP_IMAGE:-pulse-mcp:local}
    restart: unless-stopped
    environment:
      PULSE_API_BASE_URL: http://api:4000
      # Prefer a user-scoped key created in Settings. The service-token fallback
      # keeps existing installations working until their first key is configured.
      PULSE_API_TOKEN: ${PULSE_MCP_API_KEY:-${PULSE_SERVICE_TOKEN}}
      PULSE_MCP_PORT: 6060
      PULSE_MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${PULSE_MCP_HOST_PORT:-6061}:6060"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

  reminder-worker:
    build:
      context: .
      target: reminder-worker
    image: ${PULSE_REMINDER_WORKER_IMAGE:-pulse-reminder-worker:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pulse:${PULSE_DB_PASSWORD}@db:5432/pulse
      HERMES_REMINDER_WEBHOOK_URL: ${HERMES_REMINDER_WEBHOOK_URL:-}
      HERMES_REMINDER_WEBHOOK_SECRET: ${HERMES_REMINDER_WEBHOOK_SECRET:-}
      TELEGRAM_FALLBACK_BOT_TOKEN: ${TELEGRAM_FALLBACK_BOT_TOKEN:-}
      TELEGRAM_REMINDER_CHAT_ID: ${TELEGRAM_REMINDER_CHAT_ID:--1004469714848}
      TELEGRAM_REMINDER_THREAD_ID: ${TELEGRAM_REMINDER_THREAD_ID:-3}
      PULSE_PUBLIC_URL: ${AUTH_URL:-}
      REMINDER_POLL_INTERVAL_MS: ${REMINDER_POLL_INTERVAL_MS:-5000}
      REMINDER_MAX_ATTEMPTS: ${REMINDER_MAX_ATTEMPTS:-8}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal, edge]

networks:
  edge:
    name: pulse_edge
    driver: bridge
  internal:
    name: pulse_internal
    internal: true

volumes:
  pulse_postgres:
    name: pulse_postgres
