name: Pulse CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.13.0"

jobs:
  checks:
    name: Typecheck, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://pulse:ci-only@localhost:5432/pulse
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Validate production compose
        env:
          PULSE_DB_PASSWORD: ci-only-password
          PULSE_WEB_TOKEN: ci-only-web-token
          PULSE_SERVICE_TOKEN: ci-only-service-token
          PULSE_MCP_API_KEY: pulse_ci-only-user-api-key
          PULSE_MCP_HOST_PORT: 6061
          AUTH_SECRET: ci-only-auth-secret
          AUTH_URL: https://pulse.example.com
        run: docker compose -f compose.yaml config --quiet

  android-apk:
    name: Build signed Android APK
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the legacy "tools" package, which newer
          # command-line tools no longer provide.
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Validate Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          # GitHub preserves newlines copied from macOS/Linux base64 output.
          # Remove only whitespace before decoding so wrapped Base64 remains valid.
          keystore_base64="$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$keystore_base64" | base64 --decode > "$RUNNER_TEMP/pulse-release.keystore"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64; replace the secret with the raw Base64 output (without quotes)."
            exit 1
          fi
          test -s "$RUNNER_TEMP/pulse-release.keystore" || { echo "Decoded Android keystore is empty"; exit 1; }

      - name: Assemble production APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pulse-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK artifact
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "pulse-android-${GITHUB_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-android-${{ github.sha }}
          path: pulse-android-${{ github.sha }}.apk
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish APK GitHub release
    needs: android-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: pulse-android-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
